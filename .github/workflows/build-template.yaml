name: Build all templates (reusable)

on:
  workflow_call:

jobs:
  build-common:
    name: Build common package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and Test .NET solution
        uses: Arbeidstilsynet/action-dotnet-build@9e65f3cee7d86b8b60a99a9cfbf46187044a2e23 # v4
        with:
          working-directory: "./templates/common-package/SamplePackage"

  build-hexarch:
    name: Build hexarch package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and Test .NET solution
        uses: Arbeidstilsynet/action-dotnet-build@9e65f3cee7d86b8b60a99a9cfbf46187044a2e23 # v4
        with:
          working-directory: "./templates/hexarch"
